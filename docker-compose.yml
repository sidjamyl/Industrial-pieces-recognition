services:
  api:
    image: ${DOCKERHUB_NAMESPACE:-sidjamyl}/industrial-pieces-recognition-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - catalog_data:/app/data/pending
      - catalog_artifacts:/app/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    image: ${DOCKERHUB_NAMESPACE:-sidjamyl}/industrial-pieces-recognition-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  catalog_data:
  catalog_artifacts:
